name: PR Risk Review

# pull_request_target runs the workflow and script from the BASE branch, so a PR cannot
# rewrite the reviewer that judges it. The PR head is never checked out or executed here;
# the diff is read through the API and sent to the LLM as untrusted data.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-risk-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write        # squash merge + delete branch
  pull-requests: write   # approve review, inline comments, merge
  issues: write          # comment + labels (risk:*, needs-dev-check)
  checks: read           # wait for the CI check

jobs:
  risk-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}              # option A: API key (Console billing)
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # option B: Claude subscription (claude setup-token)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install Claude Code CLI (subscription token only)
        if: ${{ env.ANTHROPIC_API_KEY == '' && env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: npm install -g @anthropic-ai/claude-code@2
      - name: Score, comment, and merge if low risk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_PUSH_TOKEN: ${{ secrets.BOT_PUSH_TOKEN }}  # PAT (contents:write); optional. Without it minor fixes go to a developer
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTO_MERGE_MAX: "30"   # score <= this: auto-merge (after CI)
          BLOCK_MIN: "61"        # score >= this: fail the check
          CI_CHECK_NAME: pytest  # job name in ci.yml
        run: python3 .github/scripts/risk_review.py
